<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Paramètres du Profil', ~{::section})}">
<body>

<section>
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-danger border-2 rounded-3 mt-5 bg-dark text-white">
                <div class="card-header bg-danger text-white text-center py-3 border-0">
                    <h3 class="mb-0 fw-bold text-uppercase fst-italic"><i class="bi bi-gear-fill"></i> Mon Profil</h3>
                </div>
                <div class="card-body p-4">

                    <div th:if="${param.success}" class="alert alert-success">
                        <i class="bi bi-check-circle-fill me-2"></i> Profil mis à jour !
                    </div>

                    <form th:action="@{/setting}" method="post" th:object="${user}">

                        <div class="mb-4">
                            <label class="form-label fw-bold text-uppercase small text-muted">Adresse Email</label>
                            <input type="email" class="form-control bg-dark text-white border-secondary" th:field="*{email}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-uppercase small text-muted">Photo de Profil</label>

                            <ul class="nav nav-pills nav-fill mb-3 bg-secondary bg-opacity-25 p-1 rounded" role="tablist">
                                <li class="nav-item">
                                    <button class="nav-link active fw-bold" id="tab-url-btn" data-bs-toggle="pill" data-bs-target="#tab-url" type="button" role="tab">
                                        <i class="bi bi-link-45deg"></i> Lien URL
                                    </button>
                                </li>
                                <li class="nav-item">
                                    <button class="nav-link fw-bold" id="tab-file-btn" data-bs-toggle="pill" data-bs-target="#tab-file" type="button" role="tab">
                                        <i class="bi bi-upload"></i> Fichier
                                    </button>
                                </li>
                            </ul>

                            <div class="tab-content">
                                <div class="tab-pane fade show active" id="tab-url" role="tabpanel">
                                    <input type="url" class="form-control bg-dark text-white border-secondary" id="logoUrlInput" placeholder="https://...">
                                </div>
                                <div class="tab-pane fade" id="tab-file" role="tabpanel">
                                    <input type="file" class="form-control bg-dark text-white border-secondary" id="logoFileInput" accept="image/*">
                                </div>
                            </div>

                            <input type="hidden" id="profileImageUrl" th:field="*{profileImageUrl}">

                            <div id="logoPreviewWrapper" class="mt-4 text-center"
                                 th:style="${user.profileImageUrl == null || user.profileImageUrl.empty ? 'display: none;' : 'display: block;'}">
                                <img id="logoPreview" th:src="${user.profileImageUrl}"
                                     style="width: 120px; height: 120px; border-radius: 50%; border: 3px solid #dc3545; object-fit: cover;">
                                <div class="mt-2">
                                    <button type="button" id="logoRemove" class="btn btn-sm btn-outline-light">Supprimer</button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4 pt-3 border-top border-secondary">
                            <label class="form-label fw-bold text-uppercase small text-muted">Nouveau Mot de Passe</label>
                            <input type="password" class="form-control bg-dark text-white border-secondary" th:field="*{password}" placeholder="Laisser vide pour ne pas changer">
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-danger btn-lg fw-bold text-uppercase">Sauvegarder les modifications</button>
                            <a href="/" class="btn btn-outline-secondary fw-bold">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const urlInput = document.getElementById('logoUrlInput');
            const fileInput = document.getElementById('logoFileInput');
            const hiddenInput = document.getElementById('profileImageUrl');
            const previewImg = document.getElementById('logoPreview');
            const previewWrap = document.getElementById('logoPreviewWrapper');
            const removeBtn = document.getElementById('logoRemove');
            const tabUrlBtn = document.getElementById('tab-url-btn');
            const tabFileBtn = document.getElementById('tab-file-btn');

            const MAX_DIM = 400;

            function applyUrl() {
                const val = urlInput.value.trim();
                if (val) {
                    hiddenInput.value = val;
                    previewImg.src = val;
                    previewWrap.style.display = 'block';
                }
            }
            urlInput.addEventListener('input', applyUrl);

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        let w = img.width, h = img.height;
                        if (w > h && w > MAX_DIM) { h *= MAX_DIM/w; w = MAX_DIM; }
                        else if (h > MAX_DIM) { w *= MAX_DIM/h; h = MAX_DIM; }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const b64 = canvas.toDataURL('image/jpeg', 0.8);
                        previewImg.src = b64;
                        hiddenInput.value = b64;
                        previewWrap.style.display = 'block';
                        urlInput.value = '';
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            removeBtn.addEventListener('click', function() {
                hiddenInput.value = '';
                previewImg.src = '';
                previewWrap.style.display = 'none';
                urlInput.value = '';
                fileInput.value = '';
            });
        })();
    </script>
</section>

</body>
</html>
