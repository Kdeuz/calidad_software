<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Créer une Équipe', ~{::section})}">
<body>

<section>
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-danger border-2 rounded-3 mt-5 bg-dark text-white">
                <div class="card-header bg-danger text-white text-center py-3 border-0">
                    <h3 class="mb-0 fw-bold text-uppercase fst-italic"><i class="bi bi-flag-fill"></i> Fonder une équipe</h3>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">Message d'erreur</span>
                    </div>

                    <form action="/teams/new" method="post" th:object="${team}">

                        <div class="mb-4">
                            <label for="name" class="form-label fw-bold text-uppercase small text-muted">Nom de l'équipe</label>
                            <input type="text" class="form-control form-control-lg bg-dark text-white border-secondary" id="name" th:field="*{name}" placeholder="Ex: T1, G2 Esports..." required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-uppercase small text-muted">Logo de l'équipe</label>

                            <ul class="nav nav-pills nav-fill mb-3 bg-secondary bg-opacity-25 p-1 rounded" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active fw-bold" id="tab-url-btn" data-bs-toggle="pill" data-bs-target="#tab-url" type="button" role="tab">
                                        <i class="bi bi-link-45deg"></i> Lien URL
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link fw-bold" id="tab-file-btn" data-bs-toggle="pill" data-bs-target="#tab-file" type="button" role="tab">
                                        <i class="bi bi-upload"></i> Fichier Local
                                    </button>
                                </li>
                            </ul>

                            <div class="tab-content">
                                <div class="tab-pane fade show active" id="tab-url" role="tabpanel">
                                    <input type="url"
                                           class="form-control bg-dark text-white border-secondary"
                                           id="logoUrlInput"
                                           placeholder="https://...">
                                    <div class="form-text text-white-50">Lien direct vers une image (PNG/JPG).</div>
                                </div>

                                <div class="tab-pane fade" id="tab-file" role="tabpanel">
                                    <input type="file"
                                           class="form-control bg-dark text-white border-secondary"
                                           id="logoFileInput"
                                           accept="image/png, image/jpeg, image/webp, image/gif">
                                    <div class="form-text text-white-50">Sélectionne une image depuis ton ordinateur (redimensionnement auto).</div>
                                </div>
                            </div>

                            <input type="hidden" id="logoUrl" th:field="*{logoUrl}">

                            <div id="logoPreviewWrapper" class="mt-4 text-center" style="display: none;">
                                <img id="logoPreview"
                                     src=""
                                     alt="Preview"
                                     style="max-width: 150px; max-height: 150px; border-radius: 50%; border: 3px solid #dc3545; box-shadow: 0 0 15px rgba(220,53,69,0.4); object-fit: cover;">
                                <div class="mt-3">
                                    <button type="button" id="logoRemove" class="btn btn-sm btn-outline-light">
                                        <i class="bi bi-trash"></i> Retirer l'image
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="game" class="form-label fw-bold text-uppercase small text-muted">Jeu de spécialité</label>
                            <select id="game" th:field="*{game}" class="form-select form-select-lg bg-dark text-white border-secondary" required>
                                <option value="" disabled selected>-- Choisir un jeu --</option>
                                <option th:each="g : ${T(fr.cytech.pau.hia_jee.model.Game).values()}"
                                        th:value="${g}"
                                        th:text="${g.displayName}">
                                    Jeu
                                </option>
                            </select>
                        </div>

                        <div class="d-grid gap-2 mt-5 border-top border-secondary pt-4">
                            <button type="submit" class="btn btn-danger btn-lg fw-bold text-uppercase">Créer et recruter 🚀</button>
                            <a href="/teams/my" class="btn btn-outline-secondary fw-bold text-uppercase">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const urlInput      = document.getElementById('logoUrlInput');
            const fileInput     = document.getElementById('logoFileInput');
            const hiddenInput   = document.getElementById('logoUrl');
            const previewImg    = document.getElementById('logoPreview');
            const previewWrap   = document.getElementById('logoPreviewWrapper');
            const removeBtn     = document.getElementById('logoRemove');
            const tabUrlBtn     = document.getElementById('tab-url-btn');
            const tabFileBtn    = document.getElementById('tab-file-btn');

            const MAX_DIMENSION = 400; // Comprime a máx 400px
            const JPEG_QUALITY  = 0.85;

            // Mostrar preview si ya hay un valor precargado
            if (hiddenInput.value && hiddenInput.value.trim() !== '') {
                previewImg.src = hiddenInput.value;
                previewWrap.style.display = 'block';
                if (hiddenInput.value.startsWith('data:')) {
                    tabFileBtn.click();
                } else {
                    urlInput.value = hiddenInput.value;
                }
            }

            // ---------- OPCIÓN 1: URL ----------
            function applyUrl() {
                const value = urlInput.value.trim();
                hiddenInput.value = value;
                if (value !== '') {
                    previewImg.src = value;
                    previewImg.onerror = function () {
                        previewWrap.style.display = 'none';
                    };
                    previewImg.onload = function () {
                        previewWrap.style.display = 'block';
                    };
                } else {
                    previewWrap.style.display = 'none';
                }
            }

            urlInput.addEventListener('input', applyUrl);
            urlInput.addEventListener('blur',  applyUrl);

            // ---------- OPCIÓN 2: Archivo Local ----------
            fileInput.addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    alert('Veuillez sélectionner un fichier image valide.');
                    fileInput.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function (ev) {
                    const img = new Image();
                    img.onload = function () {
                        let w = img.width;
                        let h = img.height;

                        // Lógica de Redimensionamiento
                        if (w > h && w > MAX_DIMENSION) {
                            h = Math.round(h * MAX_DIMENSION / w);
                            w = MAX_DIMENSION;
                        } else if (h > MAX_DIMENSION) {
                            w = Math.round(w * MAX_DIMENSION / h);
                            h = MAX_DIMENSION;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width  = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);

                        // Convierte la imagen a Base64 (Texto)
                        const base64 = canvas.toDataURL('image/jpeg', JPEG_QUALITY);

                        previewImg.src      = base64;
                        hiddenInput.value   = base64;
                        previewWrap.style.display = 'block';

                        urlInput.value = ''; // Limpia la URL para evitar choques
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            // ---------- Limpieza al cambiar de pestaña ----------
            tabUrlBtn.addEventListener('shown.bs.tab', function () {
                fileInput.value = '';
            });
            tabFileBtn.addEventListener('shown.bs.tab', function () {
                urlInput.value = '';
            });

            // ---------- Botón eliminar ----------
            removeBtn.addEventListener('click', function () {
                urlInput.value      = '';
                fileInput.value     = '';
                hiddenInput.value   = '';
                previewImg.src      = '';
                previewWrap.style.display = 'none';
            });
        })();
    </script>
</section>

</body>
</html>
