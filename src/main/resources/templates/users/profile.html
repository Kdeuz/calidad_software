<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Profil du Joueur', ~{::section})}">
<body>

<section>
    <div class="container mt-5">

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show text-center" role="alert">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Succès</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">

                    <div class="card-header bg-dark text-white text-center py-4">

                        <div class="mb-3">
                            <img th:if="${player.profileImageUrl != null and !player.profileImageUrl.isEmpty()}"
                                 th:src="${player.profileImageUrl}"
                                 class="rounded-circle border border-3 border-danger shadow"
                                 style="width: 120px; height: 120px; object-fit: cover;" alt="Profil">

                            <div th:unless="${player.profileImageUrl != null and !player.profileImageUrl.isEmpty()}"
                                 class="display-1 text-secondary"><i class="bi bi-person-circle"></i></div>
                        </div>

                        <h2 class="mb-0 text-uppercase fw-bold" th:text="${player.username}">PSEUDO</h2>

                        <div>
                            <span class="badge bg-danger mt-2" th:text="${player.role}">ROLE</span>
                            <span class="badge bg-primary mt-2 ms-1"><i class="bi bi-star-fill text-warning"></i> ELO: <span th:text="${player.elo}">1200</span></span>
                        </div>

                        <div th:if="${session.user != null and session.user.id == player.id}" class="mt-4 d-flex justify-content-center">
                            <form th:action="@{/profile/edit-photo}" method="post" class="d-flex gap-2" style="width: 100%; max-width: 350px;">
                                <input type="url" name="photoUrl" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="URL de votre nouvelle photo..." required>
                                <button type="submit" class="btn btn-sm btn-outline-light"><i class="bi bi-camera-fill"></i> Changer</button>
                            </form>
                        </div>
                    </div>

                    <div class="card-body p-4">

                        <div class="row text-center mb-4">

                            <div class="col-3 border-end">
                                <h5 class="text-muted fw-bold small text-uppercase">Équipe</h5>
                                <p class="fs-6 fw-bold mt-2" th:if="${player.team != null}">
                                    <a th:href="@{/teams/{id}(id=${player.team.id})}" th:text="${player.team.name}" class="text-decoration-none text-dark hover-effect d-flex flex-column align-items-center">
                                        <img th:if="${player.team.logoUrl != null}" th:src="${player.team.logoUrl}" class="rounded mb-1" style="width: 25px; height: 25px; object-fit: cover;">
                                        <span th:text="${player.team.name}">Nom Équipe</span>
                                    </a>
                                </p>
                                <p class="fs-6 text-muted mt-2" th:if="${player.team == null}">Agent Libre</p>
                            </div>

                            <div class="col-3 border-end">
                                <h5 class="text-muted fw-bold small text-uppercase">Tournois (🏆)</h5>
                                <p class="fs-4 fw-bold text-warning mt-2">
                                    <i class="bi bi-star-fill"></i> <span th:text="${player.tournamentWins}">0</span>
                                </p>
                            </div>

                            <div class="col-3 border-end">
                                <h5 class="text-muted fw-bold small text-uppercase">Victoires (W)</h5>
                                <p class="fs-4 fw-bold text-success mt-2">
                                    <i class="bi bi-trophy-fill text-warning"></i> <span th:text="${player.wins}">0</span>
                                </p>
                            </div>

                            <div class="col-3">
                                <h5 class="text-muted fw-bold small text-uppercase">Défaites (L)</h5>
                                <p class="fs-4 fw-bold text-danger mt-2">
                                    <i class="bi bi-x-circle-fill"></i> <span th:text="${player.losses}">0</span>
                                </p>
                            </div>

                        </div>
                        <h4 class="border-bottom border-2 border-danger pb-2 mb-4 mt-4 fw-bold text-uppercase">
                            <i class="bi bi-award-fill text-danger"></i> Vitrine de Trophées
                        </h4>

                        <div class="row text-center" th:if="${player.achievements != null and !player.achievements.isEmpty()}">
                            <div class="col-md-4 mb-3" th:each="ach : ${player.achievements}">
                                <div class="card border-1 border-secondary bg-light p-3 h-100 shadow-sm" style="transition: transform 0.3s ease;">
                                    <div class="display-4" th:text="${ach.icon}">🥇</div>
                                    <h6 class="mt-3 fw-bold text-dark text-uppercase" th:text="${ach.name}">Nom</h6>
                                    <small class="text-muted" th:text="${ach.description}">Desc</small>
                                </div>
                            </div>
                        </div>

                        <div class="alert alert-secondary text-center border-0" th:if="${player.achievements == null or player.achievements.isEmpty()}">
                            <i class="bi bi-info-circle-fill"></i> Ce joueur n'a pas encore débloqué de succès.
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
