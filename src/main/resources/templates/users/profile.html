<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Profil du Joueur', ~{::section})}">
<body>

<section>
    <div class="container mt-5">

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show text-center" role="alert">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Succès</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">

                    <div class="card-header bg-dark text-white text-center py-4">

                        <div class="mb-3">
                            <img th:if="${player.profileImageUrl != null and !player.profileImageUrl.isEmpty()}"
                                 th:src="${player.profileImageUrl}"
                                 class="rounded-circle border border-3 border-danger shadow"
                                 style="width: 120px; height: 120px; object-fit: cover;" alt="Profil">

                            <div th:unless="${player.profileImageUrl != null and !player.profileImageUrl.isEmpty()}"
                                 class="display-1 text-secondary"><i class="bi bi-person-circle"></i></div>
                        </div>

                        <h2 class="mb-0 text-uppercase fw-bold" th:text="${player.username}">PSEUDO</h2>

                        <div>
                            <span class="badge bg-danger mt-2" th:text="${player.role}">ROLE</span>
                            <span class="badge bg-primary mt-2 ms-1"><i class="bi bi-star-fill text-warning"></i> ELO: <span th:text="${player.elo}">1200</span></span>
                        </div>

                        <div th:if="${session.user != null and session.user.id == player.id}" class="mt-4 bg-secondary bg-opacity-10 p-3 rounded border border-secondary" style="max-width: 450px; margin: 0 auto;">
                            <h6 class="text-warning small text-uppercase mb-2"><i class="bi bi-camera-fill"></i> Changer ma photo</h6>

                            <form th:action="@{/profile/edit-photo}" method="post">
                                <ul class="nav nav-pills nav-fill mb-2 bg-dark p-1 rounded" style="font-size: 0.8rem;" role="tablist">
                                    <li class="nav-item">
                                        <button class="nav-link active py-1 fw-bold" id="tab-url-edit-btn" data-bs-toggle="pill" data-bs-target="#tab-url-edit" type="button" role="tab">URL</button>
                                    </li>
                                    <li class="nav-item">
                                        <button class="nav-link py-1 fw-bold" id="tab-file-edit-btn" data-bs-toggle="pill" data-bs-target="#tab-file-edit" type="button" role="tab">Fichier</button>
                                    </li>
                                </ul>

                                <div class="tab-content mb-2">
                                    <div class="tab-pane fade show active" id="tab-url-edit" role="tabpanel">
                                        <input type="url" class="form-control form-control-sm bg-dark text-white border-secondary" id="logoUrlEditInput" placeholder="Nouvelle URL...">
                                    </div>
                                    <div class="tab-pane fade" id="tab-file-edit" role="tabpanel">
                                        <input type="file" class="form-control form-control-sm bg-dark text-white border-secondary" id="logoFileEditInput" accept="image/*">
                                    </div>
                                </div>

                                <input type="hidden" id="logoUrlEdit" name="photoUrl" th:value="${player.profileImageUrl}">

                                <div id="logoPreviewEditWrapper" class="d-flex align-items-center mb-2" style="display: none !important;">
                                    <img id="logoPreviewEdit" src="" style="height: 40px; width: 40px; border-radius: 50%; border: 1px solid #ffc107; object-fit: cover;">
                                    <button type="button" id="logoEditRemove" class="btn btn-sm btn-link text-danger p-0 ms-2"><i class="bi bi-x-circle-fill"></i> Annuler l'image</button>
                                </div>

                                <button type="submit" class="btn btn-sm btn-warning w-100 fw-bold text-dark text-uppercase"><i class="bi bi-upload"></i> Sauvegarder</button>
                            </form>
                        </div>
                    </div>

                    <div class="card-body p-4">

                        <div class="row text-center mb-4">

                            <div class="col-3 border-end">
                                <h5 class="text-muted fw-bold small text-uppercase">Équipe</h5>
                                <p class="fs-6 fw-bold mt-2" th:if="${player.team != null}">
                                    <a th:href="@{/teams/{id}(id=${player.team.id})}" th:text="${player.team.name}" class="text-decoration-none text-dark hover-effect d-flex flex-column align-items-center">
                                        <img th:if="${player.team.logoUrl != null}" th:src="${player.team.logoUrl}" class="rounded mb-1" style="width: 25px; height: 25px; object-fit: cover;">
                                        <span th:text="${player.team.name}">Nom Équipe</span>
                                    </a>
                                </p>
                                <p class="fs-6 text-muted mt-2" th:if="${player.team == null}">Agent Libre</p>
                            </div>

                            <div class="col-3 border-end">
                                <h5 class="text-muted fw-bold small text-uppercase">Tournois (🏆)</h5>
                                <p class="fs-4 fw-bold text-warning mt-2">
                                    <i class="bi bi-star-fill"></i> <span th:text="${player.tournamentWins}">0</span>
                                </p>
                            </div>

                            <div class="col-3 border-end">
                                <h5 class="text-muted fw-bold small text-uppercase">Victoires (W)</h5>
                                <p class="fs-4 fw-bold text-success mt-2">
                                    <i class="bi bi-trophy-fill text-warning"></i> <span th:text="${player.wins}">0</span>
                                </p>
                            </div>

                            <div class="col-3">
                                <h5 class="text-muted fw-bold small text-uppercase">Défaites (L)</h5>
                                <p class="fs-4 fw-bold text-danger mt-2">
                                    <i class="bi bi-x-circle-fill"></i> <span th:text="${player.losses}">0</span>
                                </p>
                            </div>

                        </div>
                        <h4 class="border-bottom border-2 border-danger pb-2 mb-4 mt-4 fw-bold text-uppercase">
                            <i class="bi bi-award-fill text-danger"></i> Vitrine de Trophées
                        </h4>

                        <div class="row text-center" th:if="${player.achievements != null and !player.achievements.isEmpty()}">
                            <div class="col-md-4 mb-3" th:each="ach : ${player.achievements}">
                                <div class="card border-1 border-secondary bg-light p-3 h-100 shadow-sm" style="transition: transform 0.3s ease;">
                                    <div class="display-4" th:text="${ach.icon}">🥇</div>
                                    <h6 class="mt-3 fw-bold text-dark text-uppercase" th:text="${ach.name}">Nom</h6>
                                    <small class="text-muted" th:text="${ach.description}">Desc</small>
                                </div>
                            </div>
                        </div>

                        <div class="alert alert-secondary text-center border-0" th:if="${player.achievements == null or player.achievements.isEmpty()}">
                            <i class="bi bi-info-circle-fill"></i> Ce joueur n'a pas encore débloqué de succès.
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const urlInput = document.getElementById('logoUrlEditInput');
            const fileInput = document.getElementById('logoFileEditInput');
            const hiddenInput = document.getElementById('logoUrlEdit');
            const previewImg = document.getElementById('logoPreviewEdit');
            const previewWrap = document.getElementById('logoPreviewEditWrapper');
            const removeBtn = document.getElementById('logoEditRemove');

            const MAX_DIM = 400;

            urlInput.addEventListener('input', function() {
                const val = urlInput.value.trim();
                if (val) {
                    hiddenInput.value = val;
                    previewImg.src = val;
                    previewWrap.style.setProperty('display', 'flex', 'important');
                }
            });

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        let w = img.width, h = img.height;
                        if (w > h && w > MAX_DIM) { h = Math.round(h * MAX_DIM/w); w = MAX_DIM; }
                        else if (h > MAX_DIM) { w = Math.round(w * MAX_DIM/h); h = MAX_DIM; }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const b64 = canvas.toDataURL('image/jpeg', 0.85);

                        previewImg.src = b64;
                        hiddenInput.value = b64;
                        previewWrap.style.setProperty('display', 'flex', 'important');
                        urlInput.value = '';
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            removeBtn.addEventListener('click', function() {
                hiddenInput.value = '';
                previewImg.src = '';
                previewWrap.style.setProperty('display', 'none', 'important');
                urlInput.value = '';
                fileInput.value = '';
            });
        })();
    </script>
</section>

</body>
</html>
